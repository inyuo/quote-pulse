<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>量价掘金</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--vscode-editor-background, #1e1e1e);
        color: var(--vscode-editor-foreground, #cccccc);
        font-family: var(--vscode-font-family, system-ui, 'Microsoft YaHei', sans-serif);
        font-size: 13px;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ---------- 顶栏 ---------- */
      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--vscode-panel-border, #444);
        background: var(--vscode-sideBar-background, transparent);
        flex: 0 0 auto;
      }
      .topbar h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .topbar .meta {
        color: var(--vscode-descriptionForeground, #999);
        font-size: 12px;
      }
      .topbar .spacer {
        flex: 1;
      }
      .status {
        font-size: 11px;
        color: var(--vscode-descriptionForeground, #999);
      }
      .status.error {
        color: var(--vscode-charts-red, #f14c4c);
      }
      .btn {
        cursor: pointer;
        border: 1px solid var(--vscode-button-border, transparent);
        background: var(--vscode-button-background, #0e639c);
        color: var(--vscode-button-foreground, #fff);
        border-radius: 3px;
        padding: 4px 12px;
        font-size: 12px;
      }
      .btn:hover {
        background: var(--vscode-button-hoverBackground, #1177bb);
      }

      /* ---------- Tab 栏 ---------- */
      .tabs {
        display: flex;
        gap: 2px;
        padding: 6px 12px 0;
        flex: 0 0 auto;
      }
      .tab {
        cursor: pointer;
        border: none;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--vscode-descriptionForeground, #999);
        padding: 5px 14px;
        font-size: 13px;
        font-family: inherit;
      }
      .tab.active {
        color: var(--vscode-editor-foreground, #cccccc);
        border-bottom-color: var(--vscode-focusBorder, #007acc);
      }

      /* ---------- 画布与占位 ---------- */
      .chart-wrap {
        flex: 1 1 auto;
        padding: 6px 10px;
        min-height: 0;
        display: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .empty {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--vscode-descriptionForeground, #999);
        font-size: 12px;
        line-height: 1.9;
        white-space: pre-line;
        cursor: default;
      }
      .empty.retriable {
        cursor: pointer;
      }
      .empty.retriable:hover {
        color: var(--vscode-editor-foreground, #ccc);
      }
      .guide .btn {
        margin-top: 8px;
      }

      /* ---------- 策略选股（第 4 tab，DOM 表格） ---------- */
      .lq-wrap {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 8px 12px 16px;
        display: none;
      }
      .lq-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .lq-chip {
        cursor: pointer;
        border: 1px solid var(--vscode-panel-border, #444);
        background: transparent;
        color: var(--vscode-descriptionForeground, #999);
        border-radius: 12px;
        padding: 3px 10px;
        font-size: 12px;
        font-family: inherit;
      }
      .lq-chip.active {
        color: var(--vscode-editor-foreground, #ccc);
        border-color: var(--vscode-focusBorder, #007acc);
        background: var(--vscode-list-activeSelectionBackground, rgba(0, 122, 204, 0.18));
      }
      .lq-links {
        color: var(--vscode-descriptionForeground, #999);
        font-size: 11px;
        margin-bottom: 8px;
      }
      .lq-links span {
        margin-right: 8px;
      }
      .lq-group {
        margin-bottom: 14px;
      }
      .lq-group-title {
        font-size: 12px;
        font-weight: 600;
        padding: 4px 0;
        border-bottom: 1px solid var(--vscode-panel-border, #444);
      }
      .lq-group-title .count {
        color: var(--vscode-descriptionForeground, #999);
        font-weight: 400;
      }
      .lq-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .lq-table th {
        text-align: left;
        font-weight: 400;
        color: var(--vscode-descriptionForeground, #999);
        padding: 4px 6px;
      }
      .lq-table td {
        padding: 4px 6px;
        border-bottom: 1px solid var(--vscode-panel-border, rgba(68, 68, 68, 0.4));
      }
      .lq-table tr:hover {
        background: var(--vscode-list-hoverBackground, rgba(255, 255, 255, 0.05));
      }
      .lq-row-btn {
        cursor: pointer;
        border: none;
        background: transparent;
        color: var(--vscode-textLink-foreground, #3794ff);
        font-family: inherit;
        font-size: 12px;
        padding: 0;
      }
      .lq-up {
        color: var(--vscode-charts-red, #f14c4c);
      }
      .lq-down {
        color: var(--vscode-charts-green, #4ec9b0);
      }
      .lq-placeholder {
        padding: 24px 0;
        text-align: center;
        color: var(--vscode-descriptionForeground, #999);
      }
      .lq-placeholder.retriable {
        cursor: pointer;
      }

      /* ---------- 数据碰撞（第 5 个顶层 tab） ---------- */
      .collision-wrap {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 8px 12px 16px;
        display: none;
      }
      .collision-title {
        font-size: 12px;
        font-weight: 600;
        padding: 2px 0 8px;
      }
      #collisionSummary {
        color: var(--vscode-descriptionForeground, #999);
        font-weight: 400;
        font-size: 11px;
        margin-left: 6px;
      }
      .collision-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .collision-table th {
        text-align: left;
        font-weight: 400;
        color: var(--vscode-descriptionForeground, #999);
        padding: 4px 6px;
      }
      .collision-table td {
        padding: 4px 6px;
        border-bottom: 1px solid var(--vscode-panel-border, rgba(68, 68, 68, 0.4));
        vertical-align: top;
      }
      .collision-table tr:hover {
        background: var(--vscode-list-hoverBackground, rgba(255, 255, 255, 0.05));
      }
      .lq-hit-tag {
        display: inline-block;
        margin: 0 4px 2px 0;
        padding: 1px 6px;
        border-radius: 9px;
        font-size: 11px;
        border: 1px solid var(--vscode-panel-border, #444);
        color: var(--vscode-descriptionForeground, #999);
      }
      .collision-placeholder {
        padding: 18px 0;
        text-align: center;
        color: var(--vscode-descriptionForeground, #999);
      }
      .collision-placeholder.retriable {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1>量价掘金</h1>
      <span class="meta" id="updatedAt"></span>
      <span class="status" id="status"></span>
      <span class="spacer"></span>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>

    <div class="tabs">
      <button class="tab" id="tabCjl" data-tab="cjl">量价分层</button>
      <button class="tab" id="tabNorth" data-tab="north">北向资金</button>
      <button class="tab" id="tabIndex" data-tab="index">大盘指数</button>
      <button class="tab" id="tabLq" data-tab="lq">策略选股</button>
      <button class="tab" id="tabCollision" data-tab="collision">数据碰撞</button>
    </div>

    <div class="chart-wrap" id="chartWrap">
      <canvas id="chart"></canvas>
    </div>
    <div id="chartEmpty" class="empty" style="display: none">数据加载中…</div>

    <div class="lq-wrap" id="lqWrap">
      <div class="lq-bar" id="lqTags"></div>
      <div class="lq-bar" id="lqDays"></div>
      <div class="lq-links" id="lqTsTags"></div>
      <div id="lqGroups"></div>
    </div>

    <div class="collision-wrap" id="collisionWrap">
      <div class="collision-title">数据碰撞 <span id="collisionSummary"></span></div>
      <div class="lq-bar" id="collisionDays"></div>
      <div id="collisionBody"></div>
    </div>

    <script>
      (function () {
        'use strict';

        var vscode = acquireVsCodeApi();

        /** 当前 tab（首帧 init 的 data.tab 决定，懒加载：宿主只推当前 tab 数据） */
        var currentTab = 'north';
        /**
         * 各 tab 数据缓存：undefined = 未拉取（切换后推 null，null = 拉取失败/空），
         * 有值 = 已拉取对象。仅更新本次 init 对应 tab，其他 tab 缓存保留。
         */
        var cache = { cjl: undefined, north: undefined, index: undefined, lq: undefined };
        /** 量价分层 tab 是否未登录（宿主随 cjl 推送下发，引导复用 quantLogin 面板） */
        var cjlUnlogged = false;
        /** 策略选股 tab 是否未登录（同一会话，宿主随 lq 推送下发） */
        var lqUnlogged = false;
        /** 策略/天数元数据由宿主 init 下发（单一数据源：shared/lqData） */
        var LQ_TAG_META = [];
        var LQ_DAY_META = [];
        var currentLqTag = 'ztb';
        var currentLqDays = 1;
        /** 右侧数据碰撞：6 档窗口元数据、当前窗口、最近一次碰撞结果（undefined=未收到） */
        var COLLISION_DAY_META = [];
        var currentCollisionDays = 5;
        var collision = undefined;

        var PAL_VARS = [
          ['--vscode-charts-red', '#f14c4c'],
          ['--vscode-charts-green', '#4ec9b0'],
          ['--vscode-charts-line', '#75beff'],
          ['', '#cca700'],
          ['', '#b180d7'],
        ];

        function $(id) {
          return document.getElementById(id);
        }

        /** 读取 VS Code 主题色，canvas 需要显式取值（查 CSS 变量，元素无关） */
        function cssVar(name, fallback) {
          var v = getComputedStyle(document.documentElement).getPropertyValue(name);
          return v && v.trim() ? v.trim() : fallback;
        }

        function themeColor(name, fallback) {
          return cssVar(name, fallback);
        }

        function palette(i) {
          var pick = PAL_VARS[i % PAL_VARS.length];
          return pick[0] ? themeColor(pick[0], pick[1]) : pick[1];
        }

        function setStatus(text, isError) {
          var el = $('status');
          el.textContent = text || '';
          el.className = 'status' + (isError ? ' error' : '');
        }

        function updateTabs() {
          var keys = ['cjl', 'north', 'index', 'lq', 'collision'];
          var ids = ['tabCjl', 'tabNorth', 'tabIndex', 'tabLq', 'tabCollision'];
          for (var i = 0; i < keys.length; i++) {
            $(ids[i]).className = 'tab' + (keys[i] === currentTab ? ' active' : '');
          }
        }

        /* ================= canvas 公共 ================= */
        /** 布局未完成（rect 0×0）时的延迟重画：有上限防隐藏面板下无限轮询 */
        var pendingRedraw = 0;
        var redrawAttempts = 0;
        var REDRAW_MAX_ATTEMPTS = 20;
        function scheduleRedraw() {
          if (pendingRedraw || redrawAttempts >= REDRAW_MAX_ATTEMPTS) return;
          redrawAttempts += 1;
          pendingRedraw = setTimeout(function () {
            pendingRedraw = 0;
            render();
          }, 120);
        }

        function withCanvas(draw) {
          var canvas = $('chart');
          var wrap = $('chartWrap');
          if (!canvas || !wrap) return;

          var rect = wrap.getBoundingClientRect();
          var w = rect.width;
          var h = rect.height;
          if (!(w > 0) || !(h > 0)) {
            // webview 首帧布局未完成：静默跳过并安排重画（init 消息可能先于布局到达）
            scheduleRedraw();
            return;
          }

          var dpr = window.devicePixelRatio || 1;
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          var ctx = canvas.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          draw(ctx, w, h);
          // 布局已就绪：清零重画计数，避免 20 次上限在面板多次隐藏后耗尽
          redrawAttempts = 0;
        }

        /** 数轴范围：合并多条序列的 min/max，相等时 ±1 防退化 */
        function rangeOf(series) {
          var min = Infinity;
          var max = -Infinity;
          for (var i = 0; i < series.length; i++) {
            var arr = series[i];
            for (var j = 0; j < arr.length; j++) {
              if (arr[j] < min) min = arr[j];
              if (arr[j] > max) max = arr[j];
            }
          }
          if (min === Infinity) {
            min = 0;
            max = 1;
          }
          if (min === max) {
            min -= 1;
            max += 1;
          }
          var pad = (max - min) * 0.08;
          return { min: min - pad, max: max + pad };
        }

        /* ================= Tab 1：量价分层（分时累计成交额） ================= */
        /**
         * get_share_cjl 的 price 是**分时累计成交额（元）**，实测 121/242 个分钟点，
         * 量级 1e9~1e11。旧实现把每个点画成一根横向柱并逐点标 L1/原始值，
         * 121 根柱挤在 300px 里、12 位数字越出画布，糊成「一堆线和数字」。
         * 现在改为：上方累计曲线（面积）+ 下方每分钟增量细柱，
         * 只标 5 条纵轴刻度（亿/万）、5 个分时刻度与 2 条图例。
         */
        function formatAmount(v) {
          var a = Math.abs(v);
          if (a >= 1e12) return (v / 1e12).toFixed(2) + '万亿';
          if (a >= 1e8) return (v / 1e8).toFixed(a >= 1e10 ? 0 : 2) + '亿';
          if (a >= 1e4) return (v / 1e4).toFixed(0) + '万';
          return String(Math.round(v));
        }

        /** 分时序号 → 交易时刻：上午 09:30 起 121 点，下午 13:00 起，末尾钳到 15:00 */
        function minuteLabel(i) {
          var mins = i < 121 ? 9 * 60 + 30 + i : 13 * 60 + (i - 121);
          if (mins > 15 * 60) mins = 15 * 60;
          var hh = Math.floor(mins / 60);
          var mm = mins % 60;
          return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
        }

        function drawCjl(data) {
          withCanvas(function (ctx, w, h) {
            var price = (data && data.price) || [];
            var rows = [];
            for (var i = 0; i < price.length; i++) {
              // price 元素可能为 null：跳过该点（数据层已过滤，这里再兜一层）
              if (typeof price[i] === 'number' && isFinite(price[i])) rows.push(price[i]);
            }
            if (!rows.length) return;

            var padL = 62;
            var padR = 16;
            var padT = 30;
            var padB = 22;
            var plotW = w - padL - padR;
            var plotH = h - padT - padB;
            if (plotW <= 0 || plotH <= 0) return;

            var curveH = plotH * 0.72;
            var barH = plotH - curveH - 10;
            if (barH < 12) {
              curveH = plotH;
              barH = 0;
            }

            var fg = cssVar('--vscode-descriptionForeground', '#9d9d9d');
            var grid = cssVar('--vscode-editorWidget-border', 'rgba(128,128,128,.25)');
            var lineColor = palette(2);
            var barColor = palette(0);
            var mono = cssVar('--vscode-editor-font-family', 'monospace');
            var n = rows.length;
            var xOf = function (idx) {
              return padL + (n === 1 ? plotW / 2 : (idx * plotW) / (n - 1));
            };

            // 纵轴固定 0 → 最大值：累计量从 0 起，5 条网格 + 单位化标签
            var maxV = 0;
            for (var r = 0; r < n; r++) maxV = Math.max(maxV, Math.abs(rows[r]));
            if (maxV <= 0) maxV = 1;
            var yOf = function (v) {
              return padT + curveH - (v / maxV) * curveH;
            };

            ctx.font = '10px ' + mono;
            ctx.strokeStyle = grid;
            ctx.fillStyle = fg;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            for (var s = 0; s <= 4; s++) {
              var val = (maxV * s) / 4;
              var y = yOf(val);
              ctx.beginPath();
              ctx.moveTo(padL, y);
              ctx.lineTo(padL + plotW, y);
              ctx.stroke();
              ctx.fillText(formatAmount(val), padL - 6, y);
            }

            // 横轴：只抽样 5 个分时刻度，不再逐点标号；点数少时跳过重复下标
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            var lastIdx = -1;
            for (var t = 0; t <= 4; t++) {
              var idx = Math.round((t * (n - 1)) / 4);
              if (idx === lastIdx) continue;
              lastIdx = idx;
              ctx.fillText(minuteLabel(idx), xOf(idx), padT + plotH + 4);
            }

            // 累计曲线 + 半透明面积
            ctx.beginPath();
            ctx.moveTo(xOf(0), yOf(rows[0]));
            for (var q = 1; q < n; q++) ctx.lineTo(xOf(q), yOf(rows[q]));
            ctx.lineTo(xOf(n - 1), padT + curveH);
            ctx.lineTo(xOf(0), padT + curveH);
            ctx.closePath();
            ctx.fillStyle = lineColor;
            ctx.globalAlpha = 0.12;
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.beginPath();
            ctx.moveTo(xOf(0), yOf(rows[0]));
            for (var p = 1; p < n; p++) ctx.lineTo(xOf(p), yOf(rows[p]));
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 1.6;
            ctx.stroke();

            // 每分钟增量 = 累计值差分；细柱不带任何文字，负值按 0 处理
            if (barH > 0 && n > 1) {
              var maxD = 0;
              var deltas = [];
              for (var d = 1; d < n; d++) {
                var dv = rows[d] - rows[d - 1];
                if (!isFinite(dv) || dv < 0) dv = 0;
                deltas.push(dv);
                maxD = Math.max(maxD, dv);
              }
              if (maxD <= 0) maxD = 1;
              var slot = plotW / deltas.length;
              var baseY = padT + plotH;
              ctx.fillStyle = barColor;
              ctx.globalAlpha = 0.55;
              for (var b = 0; b < deltas.length; b++) {
                var bh = (deltas[b] / maxD) * barH;
                ctx.fillRect(padL + b * slot, baseY - bh, Math.max(1, slot - 1), bh);
              }
              ctx.globalAlpha = 1;
              ctx.strokeStyle = grid;
              ctx.beginPath();
              ctx.moveTo(padL, baseY - barH - 4);
              ctx.lineTo(padL + plotW, baseY - barH - 4);
              ctx.stroke();
            }

            // 图例：日期 + 最新累计额 + 增量说明（共 2 条文字）
            ctx.font = '11px ' + mono;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillStyle = lineColor;
            ctx.fillRect(padL, 8, 12, 3);
            ctx.fillStyle = fg;
            ctx.fillText(
              '累计成交额 ' + formatAmount(rows[n - 1]) +
                (data && data.tm ? ' · ' + data.tm : ''),
              padL + 16,
              4
            );
            if (barH > 0) {
              ctx.fillStyle = barColor;
              ctx.fillRect(padL + 240, 8, 12, 3);
              ctx.fillStyle = fg;
              ctx.fillText('每分钟增量', padL + 256, 4);
            }
          });
        }

        /* ================= Tab 2：北向资金（双折线） ================= */
        function drawNorth(data) {
          withCanvas(function (ctx, w, h) {
            var times = (data && data.times) || [];
            var hgt = (data && data.hgtNet) || [];
            var szt = (data && data.szgtNet) || [];
            var n = Math.min(times.length, hgt.length, szt.length);
            if (!n) return;

            var padL = 52;
            var padR = 20;
            var padT = 24;
            var padB = 22;
            var plotW = w - padL - padR;
            var plotH = h - padT - padB;
            if (plotW <= 0 || plotH <= 0) return;

            var fg = cssVar('--vscode-descriptionForeground', '#9d9d9d');
            var grid = cssVar('--vscode-editorWidget-border', 'rgba(128,128,128,.25)');
            var hgtColor = palette(0);
            var sztColor = palette(1);

            var rng = rangeOf([hgt, szt]);
            var xOf = function (i) {
              return padL + (n === 1 ? plotW / 2 : (i * plotW) / (n - 1));
            };
            var yOf = function (v) {
              return padT + plotH - ((v - rng.min) / (rng.max - rng.min)) * plotH;
            };

            // 网格 + 纵轴数值
            ctx.font = '10px ' + cssVar('--vscode-editor-font-family', 'monospace');
            ctx.strokeStyle = grid;
            ctx.fillStyle = fg;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            var steps = 4;
            for (var s = 0; s <= steps; s++) {
              var val = rng.min + ((rng.max - rng.min) * s) / steps;
              var y = yOf(val);
              ctx.beginPath();
              ctx.moveTo(padL, y);
              ctx.lineTo(padL + plotW, y);
              ctx.stroke();
              ctx.fillText(Number(val).toFixed(2), padL - 6, y);
            }

            // 双折线
            var polylines = [
              { arr: hgt, color: hgtColor },
              { arr: szt, color: sztColor },
            ];
            for (var p = 0; p < polylines.length; p++) {
              ctx.beginPath();
              for (var k = 0; k < n; k++) {
                if (k === 0) ctx.moveTo(xOf(k), yOf(polylines[p].arr[k]));
                else ctx.lineTo(xOf(k), yOf(polylines[p].arr[k]));
              }
              ctx.strokeStyle = polylines[p].color;
              ctx.lineWidth = 1.4;
              ctx.stroke();
            }

            // x 轴刻度：times 抽样 6 个标注
            ctx.fillStyle = fg;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            var ticks = 5;
            for (var t = 0; t <= ticks; t++) {
              var idx = Math.round((t * (n - 1)) / ticks);
              ctx.fillText(String(times[idx]), xOf(idx), padT + plotH + 6);
            }

            // 文字图例
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillStyle = hgtColor;
            ctx.fillRect(padL, 6, 12, 3);
            ctx.fillStyle = fg;
            ctx.fillText('沪股通', padL + 16, 2);
            ctx.fillStyle = sztColor;
            ctx.fillRect(padL + 70, 6, 12, 3);
            ctx.fillStyle = fg;
            ctx.fillText('深股通', padL + 86, 2);
          });
        }

        /* ================= Tab 3：大盘指数（多线同图不同色） ================= */
        function drawIndex(items) {
          withCanvas(function (ctx, w, h) {
            var lines = [];
            for (var i = 0; i < items.length; i++) {
              var it = items[i] || {};
              var price = it.price || [];
              var seq = [];
              for (var k = 0; k < price.length; k++) {
                if (isFinite(Number(price[k]))) seq.push(Number(price[k]));
              }
              if (seq.length) lines.push({ name: it.name || it.code || '', spark: seq, pct: Number(it.percent) || 0 });
            }
            // 腾讯源可能返回大量指数条目，图例/线条按序取前 8 只，保证可读
            if (lines.length > 8) lines = lines.slice(0, 8);
            if (!lines.length) return;

            var padL = 64;
            var padR = 20;
            var padT = 24 + lines.length * 16;
            var padB = 16;
            var plotW = w - padL - padR;
            var plotH = h - padT - padB;
            if (plotW <= 0 || plotH <= 0) return;

            var fg = cssVar('--vscode-descriptionForeground', '#9d9d9d');
            var grid = cssVar('--vscode-editorWidget-border', 'rgba(128,128,128,.25)');

            var series = [];
            for (var m = 0; m < lines.length; m++) series.push(lines[m].spark);
            var rng = rangeOf(series);
            var n = lines[0].spark.length;
            var xOf = function (i) {
              return padL + (n === 1 ? plotW / 2 : (i * plotW) / (n - 1));
            };
            var yOf = function (v) {
              return padT + plotH - ((v - rng.min) / (rng.max - rng.min)) * plotH;
            };

            // 网格 + 纵轴
            ctx.font = '10px ' + cssVar('--vscode-editor-font-family', 'monospace');
            ctx.strokeStyle = grid;
            ctx.fillStyle = fg;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            var steps = 4;
            for (var s = 0; s <= steps; s++) {
              var val = rng.min + ((rng.max - rng.min) * s) / steps;
              var y = yOf(val);
              ctx.beginPath();
              ctx.moveTo(padL, y);
              ctx.lineTo(padL + plotW, y);
              ctx.stroke();
              ctx.fillText(Number(val).toFixed(0), padL - 6, y);
            }

            // 逐指数折线
            for (var p = 0; p < lines.length; p++) {
              var arr = lines[p].spark;
              ctx.beginPath();
              for (var q = 0; q < arr.length; q++) {
                if (q === 0) ctx.moveTo(xOf(q), yOf(arr[q]));
                else ctx.lineTo(xOf(q), yOf(arr[q]));
              }
              ctx.strokeStyle = palette(p);
              ctx.lineWidth = 1.4;
              ctx.stroke();

              // 图例：名称 + 涨跌幅（着色区分涨跌）
              ctx.textAlign = 'left';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = palette(p);
              ctx.fillRect(padL, 8 + p * 16, 10, 3);
              ctx.fillStyle = lines[p].pct >= 0 ? palette(0) : palette(1);
              var sign = lines[p].pct >= 0 ? '+' : '';
              ctx.fillText(
                lines[p].name + ' ' + sign + lines[p].pct.toFixed(2) + '%',
                padL + 14,
                14 + p * 16
              );
            }
          });
        }

        /* ================= 渲染分发 ================= */
        function render() {
          updateTabs();

          var box = $('chartEmpty');
          var wrap = $('chartWrap');
          var lqWrap = $('lqWrap');
          var collisionWrap = $('collisionWrap');

          // 第 4/5 tab 走 DOM 表格，不进入 canvas 绘制路径
          if (currentTab === 'collision') {
            wrap.style.display = 'none';
            box.style.display = 'none';
            lqWrap.style.display = 'none';
            collisionWrap.style.display = 'block';
            renderCollision();
            return;
          }
          collisionWrap.style.display = 'none';

          if (currentTab === 'lq') {
            wrap.style.display = 'none';
            box.style.display = 'none';
            lqWrap.style.display = 'block';
            renderLq();
            return;
          }
          lqWrap.style.display = 'none';

          var data = cache[currentTab];

          // 未登录引导（仅 cjl tab）：按钮换起 quantLogin 登录面板
          if (currentTab === 'cjl' && cjlUnlogged) {
            wrap.style.display = 'none';
            box.style.display = 'inline-flex';
            box.innerHTML =
              '<div class="guide">量价分层数据需授权「量价掘金」读取\n' +
              '<button class="btn" id="loginBtn">微信扫码登录</button></div>';
            $('loginBtn').addEventListener('click', function () {
              vscode.postMessage({ command: 'openLogin' });
            });
            return;
          }

          if (data === undefined || data === null) {
            wrap.style.display = 'none';
            box.style.display = 'inline-flex';
            box.innerHTML =
              data === undefined
                ? '<div class="empty-text">数据加载中…</div>'
                : '<div class="empty-text">数据加载失败，点击重试</div>';
            box.className = 'empty' + (data === null ? ' retriable' : '');
            return;
          }

          box.style.display = 'none';
          box.className = 'empty';
          wrap.style.display = 'block';

          if (currentTab === 'cjl') drawCjl(data);
          else if (currentTab === 'north') drawNorth(data);
          else if (currentTab === 'index') drawIndex(data);
        }

        /* ================= 策略选股（第 4 tab） ================= */
        /** 第三方文本进 innerHTML 前转义，避免注入 */
        function esc(text) {
          return String(text === undefined || text === null ? '' : text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function percentCell(percent) {
          if (percent === null || percent === undefined || !isFinite(percent)) return '<td>-</td>';
          var cls = percent >= 0 ? 'lq-up' : 'lq-down';
          var sign = percent >= 0 ? '+' : '';
          return '<td class="' + cls + '">' + sign + Number(percent).toFixed(2) + '%</td>';
        }

        /** 策略 chips 与天数 chips（元数据由宿主 init 下发） */
        function renderLqBars() {
          var tagHtml = '';
          for (var i = 0; i < LQ_TAG_META.length; i++) {
            var t = LQ_TAG_META[i];
            tagHtml +=
              '<button type="button" class="lq-chip' +
              (t.tag === currentLqTag ? ' active' : '') +
              '" data-tag="' + esc(t.tag) + '">' + esc(t.label) + '</button>';
          }
          $('lqTags').innerHTML = tagHtml;

          var dayHtml = '';
          for (var j = 0; j < LQ_DAY_META.length; j++) {
            var d = LQ_DAY_META[j];
            dayHtml +=
              '<button type="button" class="lq-chip' +
              (d.num === currentLqDays ? ' active' : '') +
              '" data-days="' + d.num + '">' + esc(d.name) + '</button>';
          }
          $('lqDays').innerHTML = dayHtml;
        }

        /** 两级分组表格：未登录/加载中/失败/空数据各有占位 */
        function renderLq() {
          renderLqBars();
          var data = cache.lq;
          var box = $('lqGroups');

          if (lqUnlogged) {
            $('lqTsTags').innerHTML = '';
            box.innerHTML =
              '<div class="lq-placeholder">策略选股数据需授权「量价掘金」读取<br>' +
              '<button class="btn" id="lqLoginBtn" style="margin-top:8px">微信扫码登录</button></div>';
            $('lqLoginBtn').addEventListener('click', function () {
              vscode.postMessage({ command: 'openLogin' });
            });
            return;
          }

          if (data === undefined) {
            $('lqTsTags').innerHTML = '';
            box.innerHTML = '<div class="lq-placeholder">数据加载中…</div>';
            return;
          }
          if (data === null) {
            $('lqTsTags').innerHTML = '';
            box.innerHTML =
              '<div class="lq-placeholder retriable" id="lqRetry">数据加载失败，点击重试</div>';
            $('lqRetry').addEventListener('click', function () {
              vscode.postMessage({ command: 'refresh' });
            });
            return;
          }

          var links = '';
          var ts = data.tsTags || [];
          for (var k = 0; k < ts.length; k++) {
            if (ts[k] && ts[k].doc) links += '<span>' + esc(ts[k].doc) + '</span>';
          }
          $('lqTsTags').innerHTML = links;

          var groups = data.groups || [];
          if (!groups.length) {
            box.innerHTML = '<div class="lq-placeholder">暂无数据</div>';
            return;
          }

          var html = '';
          for (var g = 0; g < groups.length; g++) {
            var group = groups[g];
            var rows = group.rows || [];
            html +=
              '<div class="lq-group"><div class="lq-group-title">' +
              esc(group.title || '未命名分组') +
              ' <span class="count">' + rows.length + ' 只</span></div>' +
              '<table class="lq-table"><thead><tr><th>代码</th><th>名称</th><th>涨跌幅</th>' +
              '<th>说明</th><th></th></tr></thead><tbody>';
            for (var r = 0; r < rows.length; r++) {
              var row = rows[r];
              html +=
                '<tr><td>' + esc(row.code) + '</td><td>' + esc(row.name) + '</td>' +
                percentCell(row.percent) + '<td>' + esc(row.note) + '</td>' +
                '<td><button type="button" class="lq-row-btn" data-code="' +
                esc(row.code) + '">资金动态</button></td></tr>';
            }
            html += '</tbody></table></div>';
          }
          box.innerHTML = html;
        }

        /* ================= 右侧「数据碰撞」 ================= */
        /** 6 档窗口 chips（元数据由宿主 init 下发，与左侧 8 档互不影响） */
        function renderCollisionBars() {
          var html = '';
          for (var j = 0; j < COLLISION_DAY_META.length; j++) {
            var d = COLLISION_DAY_META[j];
            html +=
              '<button type="button" class="lq-chip' +
              (d.num === currentCollisionDays ? ' active' : '') +
              '" data-days="' + d.num + '">' + esc(d.name) + '</button>';
          }
          $('collisionDays').innerHTML = html;
        }

        /** 结果表：只显示命中 ≥2 的股票，策略标签列在最后 */
        function renderCollision() {
          renderCollisionBars();
          var box = $('collisionBody');
          var summary = $('collisionSummary');

          if (collision === undefined || collision === null) {
            summary.textContent = '';
            box.innerHTML = '<div class="collision-placeholder">碰撞计算中…</div>';
            return;
          }
          if (collision.unlogged) {
            summary.textContent = '';
            box.innerHTML =
              '<div class="collision-placeholder">数据碰撞需授权「量价掘金」读取<br>' +
              '<button class="btn" id="collisionLoginBtn" style="margin-top:8px">微信扫码登录</button></div>';
            $('collisionLoginBtn').addEventListener('click', function () {
              vscode.postMessage({ command: 'openLogin' });
            });
            return;
          }
          if (collision.failed) {
            summary.textContent = '已取 0/' + collision.total;
            box.innerHTML =
              '<div class="collision-placeholder retriable" id="collisionRetry">数据加载失败，点击重试</div>';
            $('collisionRetry').addEventListener('click', function () {
              vscode.postMessage({ command: 'refreshCollision' });
            });
            return;
          }

          var rows = collision.rows || [];
          var available = typeof collision.available === 'number' ? collision.available : 0;
          var total = typeof collision.total === 'number' ? collision.total : 0;
          var daysName = '近' + currentCollisionDays + '天';
          summary.textContent =
            '命中≥2 共 ' + rows.length + ' 只 · 已取 ' + available + '/' + total + ' · ' + daysName;

          if (!rows.length) {
            box.innerHTML =
              '<div class="collision-placeholder">' + esc(daysName) +
              '没有命中 ≥2 个策略的股票</div>';
            return;
          }

          var html =
            '<table class="collision-table"><thead><tr><th>代码</th><th>名称</th>' +
            '<th>命中</th><th>标签</th><th></th></tr></thead><tbody>';
          for (var r = 0; r < rows.length; r++) {
            var row = rows[r];
            var tags = '';
            var list = row.tags || [];
            for (var t = 0; t < list.length; t++) {
              tags += '<span class="lq-hit-tag">' + esc(list[t]) + '</span>';
            }
            html +=
              '<tr><td>' + esc(row.code) + '</td><td>' + esc(row.name) + '</td>' +
              '<td>' + esc(row.hits) + '</td><td>' + tags + '</td>' +
              '<td><button type="button" class="lq-row-btn" data-code="' +
              esc(row.code) + '">资金动态</button></td></tr>';
          }
          html += '</tbody></table>';
          box.innerHTML = html;
        }

        /* ================= 消息 ================= */
        window.addEventListener('message', function (event) {
          var msg = event.data;
          if (!msg || !msg.data) return;

          // 碰撞数据走独立消息：失败/重试都不牵动左侧策略表格
          if (msg.type === 'collision') {
            collision = msg.data;
            if (typeof msg.data.days === 'number') currentCollisionDays = msg.data.days;
            renderCollision();
            return;
          }

          if (msg.type !== 'init' || !msg.data.tab) return;
          var data = msg.data;

          currentTab = data.tab;
          // cjl 推送携带登录标记，供未登录引导区分显示
          cjlUnlogged = data.cjlUnlogged === true;
          lqUnlogged = data.lqUnlogged === true;
          if (Array.isArray(data.lqTags)) LQ_TAG_META = data.lqTags;
          if (Array.isArray(data.lqDays)) LQ_DAY_META = data.lqDays;
          if (Array.isArray(data.lqCollisionDays)) COLLISION_DAY_META = data.lqCollisionDays;
          if (typeof data.collisionDays === 'number') currentCollisionDays = data.collisionDays;

          // 仅更新本次推送对应 tab 的缓存，其他 tab 缓存保留（避免覆盖已取数据）
          if (data.tab === 'cjl') cache.cjl = data.cjl;
          else if (data.tab === 'north') cache.north = data.north;
          else if (data.tab === 'index') cache.index = data.index;
          else if (data.tab === 'lq') {
            cache.lq = data.lq;
            if (data.lq && data.lq.tag) currentLqTag = data.lq.tag;
            if (data.lq && data.lq.days) currentLqDays = data.lq.days;
          }

          var ts = data.updatedAt;
          $('updatedAt').textContent = ts ? '更新于 ' + new Date(ts).toLocaleTimeString() : '';
          setStatus('');
          render();

          // 进入/刷新「数据碰撞」tab 才向宿主索取数据；宿主命中 30min 缓存时不发网络请求
          if (data.tab === 'collision') vscode.postMessage({ command: 'requestCollision' });
        });

        /* ================= 交互 ================= */
        var TAB_IDS = {
          tabCjl: 'cjl',
          tabNorth: 'north',
          tabIndex: 'index',
          tabLq: 'lq',
          tabCollision: 'collision',
        };
        for (var tid in TAB_IDS) {
          (function (id) {
            $(id).addEventListener('click', function () {
              var tab = TAB_IDS[id];
              if (tab === currentTab) return;
              currentTab = tab;
              render();
              vscode.postMessage({ command: 'selectTab', tab: tab });
            });
          })(tid);
        }

        $('refreshBtn').addEventListener('click', function () {
          vscode.postMessage({ command: 'refresh' });
        });

        // 失败占位点击重试（元素不随 innerHTML 重建，启动时绑定一次）
        $('chartEmpty').addEventListener('click', function () {
          if (cache[currentTab] === null) {
            vscode.postMessage({ command: 'refresh' });
          }
        });

        // 策略选股：三个容器各绑一次点击委托（innerHTML 重建不影响委托）
        $('lqTags').addEventListener('click', function (e) {
          var tag = e && e.target && e.target.getAttribute ? e.target.getAttribute('data-tag') : null;
          if (tag) vscode.postMessage({ command: 'selectLqTag', tag: tag });
        });
        $('lqDays').addEventListener('click', function (e) {
          var days = e && e.target && e.target.getAttribute ? e.target.getAttribute('data-days') : null;
          if (days) vscode.postMessage({ command: 'selectLqDays', days: Number(days) });
        });
        $('lqGroups').addEventListener('click', function (e) {
          var code = e && e.target && e.target.getAttribute ? e.target.getAttribute('data-code') : null;
          if (code) vscode.postMessage({ command: 'openStock', code: code });
        });

        // 右侧碰撞：切档与结果行点击委托（innerHTML 重建不影响委托）
        $('collisionDays').addEventListener('click', function (e) {
          var days = e && e.target && e.target.getAttribute ? e.target.getAttribute('data-days') : null;
          if (!days) return;
          currentCollisionDays = Number(days);
          renderCollisionBars();
          vscode.postMessage({ command: 'selectCollisionDays', days: Number(days) });
        });
        $('collisionBody').addEventListener('click', function (e) {
          var code = e && e.target && e.target.getAttribute ? e.target.getAttribute('data-code') : null;
          if (code) vscode.postMessage({ command: 'openStock', code: code });
        });

        // 布局变化重画当前图表 tab（策略选股/数据碰撞是 DOM 表格，无需重画）
        window.addEventListener('resize', function () {
          if (currentTab === 'lq' || currentTab === 'collision') return;
          render();
        });

        setStatus('连接中…');
        vscode.postMessage({ command: 'ready' });
      })();
    </script>
  </body>
</html>
