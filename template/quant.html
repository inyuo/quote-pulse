<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>量化面板</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--vscode-editor-background, #1e1e1e);
        color: var(--vscode-editor-foreground, #cccccc);
        font-family: var(--vscode-font-family, system-ui, 'Microsoft YaHei', sans-serif);
        font-size: 13px;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ---------- 顶栏 ---------- */
      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--vscode-panel-border, #444);
        background: var(--vscode-sideBar-background, transparent);
        flex: 0 0 auto;
      }
      .topbar h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .topbar .meta {
        color: var(--vscode-descriptionForeground, #999);
        font-size: 12px;
      }
      .topbar .spacer {
        flex: 1;
      }
      .status {
        font-size: 11px;
        color: var(--vscode-descriptionForeground, #999);
      }
      .status.error {
        color: var(--vscode-charts-red, #f14c4c);
      }
      .btn {
        cursor: pointer;
        border: 1px solid var(--vscode-button-border, transparent);
        background: var(--vscode-button-background, #0e639c);
        color: var(--vscode-button-foreground, #fff);
        border-radius: 3px;
        padding: 4px 12px;
        font-size: 12px;
      }
      .btn:hover {
        background: var(--vscode-button-hoverBackground, #1177bb);
      }

      /* ---------- Tab 栏 ---------- */
      .tabs {
        display: flex;
        gap: 2px;
        padding: 6px 12px 0;
        flex: 0 0 auto;
      }
      .tab {
        cursor: pointer;
        border: none;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--vscode-descriptionForeground, #999);
        padding: 5px 14px;
        font-size: 13px;
        font-family: inherit;
      }
      .tab.active {
        color: var(--vscode-editor-foreground, #cccccc);
        border-bottom-color: var(--vscode-focusBorder, #007acc);
      }

      /* ---------- 画布与占位 ---------- */
      .chart-wrap {
        flex: 1 1 auto;
        padding: 6px 10px;
        min-height: 0;
        display: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .empty {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--vscode-descriptionForeground, #999);
        font-size: 12px;
        line-height: 1.9;
        white-space: pre-line;
        cursor: default;
      }
      .empty.retriable {
        cursor: pointer;
      }
      .empty.retriable:hover {
        color: var(--vscode-editor-foreground, #ccc);
      }
      .guide .btn {
        margin-top: 8px;
      }

      /* ---------- 公共 chips（天数 / 标签筛选） ---------- */
      .lq-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .lq-chip {
        cursor: pointer;
        border: 1px solid var(--vscode-panel-border, #444);
        background: transparent;
        color: var(--vscode-descriptionForeground, #999);
        border-radius: 12px;
        padding: 3px 10px;
        font-size: 12px;
        font-family: inherit;
      }
      .lq-chip.active {
        color: var(--vscode-editor-foreground, #ccc);
        border-color: var(--vscode-focusBorder, #007acc);
        background: var(--vscode-list-activeSelectionBackground, rgba(0, 122, 204, 0.18));
      }
      .lq-chip.zero {
        opacity: 0.5;
      }
      .lq-row-btn {
        cursor: pointer;
        border: none;
        background: transparent;
        color: var(--vscode-textLink-foreground, #3794ff);
        font-family: inherit;
        font-size: 12px;
        padding: 0;
      }
      .filter-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }
      .filter-input {
        flex: 0 1 220px;
        max-width: 100%;
        border: 1px solid var(--vscode-panel-border, #444);
        background: var(--vscode-input-background, transparent);
        color: var(--vscode-input-foreground, #ccc);
        font-family: inherit;
        font-size: 12px;
        border-radius: 3px;
        padding: 4px 8px;
      }
      .filter-hint {
        color: var(--vscode-descriptionForeground, #999);
        font-size: 11px;
      }

      /* ---------- 数据碰撞（第 4 个顶层 tab：DOM 表格 + 标签筛选） ---------- */
      .collision-wrap {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 8px 12px 16px;
        display: none;
      }
      .collision-title {
        font-size: 12px;
        font-weight: 600;
        padding: 2px 0 8px;
      }
      #collisionSummary {
        color: var(--vscode-descriptionForeground, #999);
        font-weight: 400;
        font-size: 11px;
        margin-left: 6px;
      }
      .collision-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .collision-table th {
        text-align: left;
        font-weight: 400;
        color: var(--vscode-descriptionForeground, #999);
        padding: 4px 6px;
      }
      .collision-table th.sortable {
        cursor: pointer;
        user-select: none;
      }
      .collision-table td {
        padding: 4px 6px;
        border-bottom: 1px solid var(--vscode-panel-border, rgba(68, 68, 68, 0.4));
        vertical-align: top;
      }
      .collision-table tr:hover {
        background: var(--vscode-list-hoverBackground, rgba(255, 255, 255, 0.05));
      }
      .lq-hit-tag {
        display: inline-block;
        margin: 0 4px 2px 0;
        padding: 1px 6px;
        border-radius: 9px;
        font-size: 11px;
        border: 1px solid var(--vscode-panel-border, #444);
        color: var(--vscode-descriptionForeground, #999);
      }
      .lq-hit-tag.filterable {
        cursor: pointer;
      }
      .lq-hit-tag.filterable:hover {
        border-color: var(--vscode-focusBorder, #007acc);
        color: var(--vscode-editor-foreground, #ccc);
      }
      .lq-hit-tag.selected {
        border-color: var(--vscode-focusBorder, #007acc);
        background: var(--vscode-list-activeSelectionBackground, rgba(0, 122, 204, 0.18));
        color: var(--vscode-editor-foreground, #ccc);
      }
      .collision-placeholder {
        padding: 18px 0;
        text-align: center;
        color: var(--vscode-descriptionForeground, #999);
        line-height: 1.9;
      }
      .collision-placeholder.retriable {
        cursor: pointer;
      }
      .collision-placeholder .btn {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1>量化面板</h1>
      <span class="meta" id="updatedAt"></span>
      <span class="status" id="status"></span>
      <span class="spacer"></span>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>

    <div class="tabs">
      <button class="tab" id="tabCjl" data-tab="cjl">量价分层</button>
      <button class="tab" id="tabNorth" data-tab="north">北向资金</button>
      <button class="tab" id="tabIndex" data-tab="index">大盘指数</button>
      <button class="tab" id="tabCollision" data-tab="collision">数据碰撞</button>
    </div>

    <div class="chart-wrap" id="chartWrap">
      <canvas id="chart"></canvas>
    </div>
    <div id="chartEmpty" class="empty" style="display: none">数据加载中…</div>

    <div class="collision-wrap" id="collisionWrap">
      <div class="collision-title">数据碰撞 <span id="collisionSummary"></span></div>
      <div class="lq-bar" id="collisionDays"></div>
      <div class="lq-bar" id="collisionTagBar"></div>
      <div class="filter-bar">
        <input class="filter-input" id="collisionSearch" type="text" placeholder="搜索代码 / 名称" />
        <button type="button" class="lq-chip" id="collisionClear">清空筛选</button>
        <span class="filter-hint" id="collisionFilterHint">点标签叠加筛选（同时命中），点击「命中」列可排序</span>
      </div>
      <div id="collisionBody"></div>
    </div>

    <script>
      (function () {
        'use strict';

        var vscode = acquireVsCodeApi();

        /** 当前 tab（首帧 init 的 data.tab 决定，懒加载：宿主只推当前 tab 数据） */
        var currentTab = 'north';
        /**
         * 各 tab 数据缓存：undefined = 未拉取，null = 拉取失败/空，有值 = 已拉取。
         * 仅更新本次 init 对应 tab，其他 tab 缓存保留。
         */
        var cache = { cjl: undefined, north: undefined, index: undefined };
        /** 数据碰撞：窗口/标签元数据、当前窗口、最近一次结果（undefined=未收到） */
        var COLLISION_DAY_META = [];
        var COLLISION_TAG_META = [];
        var currentCollisionDays = 5;
        var collision = undefined;
        /** 标签筛选状态：多选按「同时命中」，搜索匹配代码/名称，命中数默认降序 */
        var selectedTags = [];
        var searchText = '';
        var sortDesc = true;

        var PAL_VARS = [
          ['--vscode-charts-red', '#f14c4c'],
          ['--vscode-charts-green', '#4ec9b0'],
          ['--vscode-charts-line', '#75beff'],
          ['', '#cca700'],
          ['', '#b180d7'],
        ];

        function $(id) {
          return document.getElementById(id);
        }

        /** 读取 VS Code 主题色，canvas 需要显式取值（查 CSS 变量，元素无关） */
        function cssVar(name, fallback) {
          var v = getComputedStyle(document.documentElement).getPropertyValue(name);
          return v && v.trim() ? v.trim() : fallback;
        }

        function themeColor(name, fallback) {
          return cssVar(name, fallback);
        }

        function palette(i) {
          var pick = PAL_VARS[i % PAL_VARS.length];
          return pick[0] ? themeColor(pick[0], pick[1]) : pick[1];
        }

        function setStatus(text, isError) {
          var el = $('status');
          el.textContent = text || '';
          el.className = 'status' + (isError ? ' error' : '');
        }

        function updateTabs() {
          var keys = ['cjl', 'north', 'index', 'collision'];
          var ids = ['tabCjl', 'tabNorth', 'tabIndex', 'tabCollision'];
          for (var i = 0; i < keys.length; i++) {
            $(ids[i]).className = 'tab' + (keys[i] === currentTab ? ' active' : '');
          }
        }

        /* ================= canvas 公共 ================= */
        /** 布局未完成（rect 0×0）时的延迟重画：有上限防隐藏面板下无限轮询 */
        var pendingRedraw = 0;
        var redrawAttempts = 0;
        var REDRAW_MAX_ATTEMPTS = 20;
        function scheduleRedraw() {
          if (pendingRedraw || redrawAttempts >= REDRAW_MAX_ATTEMPTS) return;
          redrawAttempts += 1;
          pendingRedraw = setTimeout(function () {
            pendingRedraw = 0;
            render();
          }, 120);
        }

        function withCanvas(draw) {
          var canvas = $('chart');
          var wrap = $('chartWrap');
          if (!canvas || !wrap) return;

          var rect = wrap.getBoundingClientRect();
          var w = rect.width;
          var h = rect.height;
          if (!(w > 0) || !(h > 0)) {
            // webview 首帧布局未完成：静默跳过并安排重画（init 消息可能先于布局到达）
            scheduleRedraw();
            return;
          }

          var dpr = window.devicePixelRatio || 1;
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          var ctx = canvas.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          draw(ctx, w, h);
          // 布局已就绪：清零重画计数，避免 20 次上限在面板多次隐藏后耗尽
          redrawAttempts = 0;
        }

        /** 数轴范围：合并多条序列的 min/max，相等时 ±1 防退化 */
        function rangeOf(series) {
          var min = Infinity;
          var max = -Infinity;
          for (var i = 0; i < series.length; i++) {
            var arr = series[i];
            for (var j = 0; j < arr.length; j++) {
              if (arr[j] < min) min = arr[j];
              if (arr[j] > max) max = arr[j];
            }
          }
          if (min === Infinity) {
            min = 0;
            max = 1;
          }
          if (min === max) {
            min -= 1;
            max += 1;
          }
          var pad = (max - min) * 0.08;
          return { min: min - pad, max: max + pad };
        }

        /* ================= Tab 1：量价分层（分时累计成交额） ================= */
        /**
         * get_share_cjl 的 price 是**分时累计成交额（元）**，实测 121/242 个分钟点，
         * 量级 1e9~1e11。旧实现把每个点画成一根横向柱并逐点标 L1/原始值，
         * 121 根柱挤在 300px 里、12 位数字越出画布，糊成「一堆线和数字」。
         * 现在改为：上方累计曲线（面积）+ 下方每分钟增量细柱，
         * 只标 5 条纵轴刻度（亿/万）、5 个分时刻度与 2 条图例。
         */
        function formatAmount(v) {
          var a = Math.abs(v);
          if (a >= 1e12) return (v / 1e12).toFixed(2) + '万亿';
          if (a >= 1e8) return (v / 1e8).toFixed(a >= 1e10 ? 0 : 2) + '亿';
          if (a >= 1e4) return (v / 1e4).toFixed(0) + '万';
          return String(Math.round(v));
        }

        /** 分时序号 → 交易时刻：上午 09:30 起 121 点，下午 13:00 起，末尾钳到 15:00 */
        function minuteLabel(i) {
          var mins = i < 121 ? 9 * 60 + 30 + i : 13 * 60 + (i - 121);
          if (mins > 15 * 60) mins = 15 * 60;
          var hh = Math.floor(mins / 60);
          var mm = mins % 60;
          return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
        }

        function drawCjl(data) {
          withCanvas(function (ctx, w, h) {
            var price = (data && data.price) || [];
            var rows = [];
            for (var i = 0; i < price.length; i++) {
              // price 元素可能为 null：跳过该点（数据层已过滤，这里再兜一层）
              if (typeof price[i] === 'number' && isFinite(price[i])) rows.push(price[i]);
            }
            if (!rows.length) return;

            var padL = 62;
            var padR = 16;
            var padT = 30;
            var padB = 22;
            var plotW = w - padL - padR;
            var plotH = h - padT - padB;
            if (plotW <= 0 || plotH <= 0) return;

            var curveH = plotH * 0.72;
            var barH = plotH - curveH - 10;
            if (barH < 12) {
              curveH = plotH;
              barH = 0;
            }

            var fg = cssVar('--vscode-descriptionForeground', '#9d9d9d');
            var grid = cssVar('--vscode-editorWidget-border', 'rgba(128,128,128,.25)');
            var lineColor = palette(2);
            var barColor = palette(0);
            var mono = cssVar('--vscode-editor-font-family', 'monospace');
            var n = rows.length;
            var xOf = function (idx) {
              return padL + (n === 1 ? plotW / 2 : (idx * plotW) / (n - 1));
            };

            // 纵轴固定 0 → 最大值：累计量从 0 起，5 条网格 + 单位化标签
            var maxV = 0;
            for (var r = 0; r < n; r++) maxV = Math.max(maxV, Math.abs(rows[r]));
            if (maxV <= 0) maxV = 1;
            var yOf = function (v) {
              return padT + curveH - (v / maxV) * curveH;
            };

            ctx.font = '10px ' + mono;
            ctx.strokeStyle = grid;
            ctx.fillStyle = fg;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            for (var s = 0; s <= 4; s++) {
              var val = (maxV * s) / 4;
              var y = yOf(val);
              ctx.beginPath();
              ctx.moveTo(padL, y);
              ctx.lineTo(padL + plotW, y);
              ctx.stroke();
              ctx.fillText(formatAmount(val), padL - 6, y);
            }

            // 横轴：只抽样 5 个分时刻度，不再逐点标号；点数少时跳过重复下标
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            var lastIdx = -1;
            for (var t = 0; t <= 4; t++) {
              var idx = Math.round((t * (n - 1)) / 4);
              if (idx === lastIdx) continue;
              lastIdx = idx;
              ctx.fillText(minuteLabel(idx), xOf(idx), padT + plotH + 4);
            }

            // 累计曲线 + 半透明面积
            ctx.beginPath();
            ctx.moveTo(xOf(0), yOf(rows[0]));
            for (var q = 1; q < n; q++) ctx.lineTo(xOf(q), yOf(rows[q]));
            ctx.lineTo(xOf(n - 1), padT + curveH);
            ctx.lineTo(xOf(0), padT + curveH);
            ctx.closePath();
            ctx.fillStyle = lineColor;
            ctx.globalAlpha = 0.12;
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.beginPath();
            ctx.moveTo(xOf(0), yOf(rows[0]));
            for (var p = 1; p < n; p++) ctx.lineTo(xOf(p), yOf(rows[p]));
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 1.6;
            ctx.stroke();

            // 每分钟增量 = 累计值差分；细柱不带任何文字，负值按 0 处理
            if (barH > 0 && n > 1) {
              var maxD = 0;
              var deltas = [];
              for (var d = 1; d < n; d++) {
                var dv = rows[d] - rows[d - 1];
                if (!isFinite(dv) || dv < 0) dv = 0;
                deltas.push(dv);
                maxD = Math.max(maxD, dv);
              }
              if (maxD <= 0) maxD = 1;
              var slot = plotW / deltas.length;
              var baseY = padT + plotH;
              ctx.fillStyle = barColor;
              ctx.globalAlpha = 0.55;
              for (var b = 0; b < deltas.length; b++) {
                var bh = (deltas[b] / maxD) * barH;
                ctx.fillRect(padL + b * slot, baseY - bh, Math.max(1, slot - 1), bh);
              }
              ctx.globalAlpha = 1;
              ctx.strokeStyle = grid;
              ctx.beginPath();
              ctx.moveTo(padL, baseY - barH - 4);
              ctx.lineTo(padL + plotW, baseY - barH - 4);
              ctx.stroke();
            }

            // 图例：日期 + 最新累计额 + 增量说明（共 2 条文字）
            ctx.font = '11px ' + mono;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillStyle = lineColor;
            ctx.fillRect(padL, 8, 12, 3);
            ctx.fillStyle = fg;
            ctx.fillText(
              '累计成交额 ' + formatAmount(rows[n - 1]) +
                (data && data.tm ? ' · ' + data.tm : ''),
              padL + 16,
              4
            );
            if (barH > 0) {
              ctx.fillStyle = barColor;
              ctx.fillRect(padL + 240, 8, 12, 3);
              ctx.fillStyle = fg;
              ctx.fillText('每分钟增量', padL + 256, 4);
            }
          });
        }

        /* ================= Tab 2：北向资金（双折线） ================= */
        function drawNorth(data) {
          withCanvas(function (ctx, w, h) {
            var times = (data && data.times) || [];
            var hgt = (data && data.hgtNet) || [];
            var szt = (data && data.szgtNet) || [];
            var n = Math.min(times.length, hgt.length, szt.length);
            if (!n) return;

            var padL = 52;
            var padR = 20;
            var padT = 24;
            var padB = 22;
            var plotW = w - padL - padR;
            var plotH = h - padT - padB;
            if (plotW <= 0 || plotH <= 0) return;

            var fg = cssVar('--vscode-descriptionForeground', '#9d9d9d');
            var grid = cssVar('--vscode-editorWidget-border', 'rgba(128,128,128,.25)');
            var hgtColor = palette(0);
            var sztColor = palette(1);

            var rng = rangeOf([hgt, szt]);
            var xOf = function (i) {
              return padL + (n === 1 ? plotW / 2 : (i * plotW) / (n - 1));
            };
            var yOf = function (v) {
              return padT + plotH - ((v - rng.min) / (rng.max - rng.min)) * plotH;
            };

            // 网格 + 纵轴数值
            ctx.font = '10px ' + cssVar('--vscode-editor-font-family', 'monospace');
            ctx.strokeStyle = grid;
            ctx.fillStyle = fg;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            var steps = 4;
            for (var s = 0; s <= steps; s++) {
              var val = rng.min + ((rng.max - rng.min) * s) / steps;
              var y = yOf(val);
              ctx.beginPath();
              ctx.moveTo(padL, y);
              ctx.lineTo(padL + plotW, y);
              ctx.stroke();
              ctx.fillText(Number(val).toFixed(2), padL - 6, y);
            }

            // 双折线
            var polylines = [
              { arr: hgt, color: hgtColor },
              { arr: szt, color: sztColor },
            ];
            for (var p = 0; p < polylines.length; p++) {
              ctx.beginPath();
              for (var k = 0; k < n; k++) {
                if (k === 0) ctx.moveTo(xOf(k), yOf(polylines[p].arr[k]));
                else ctx.lineTo(xOf(k), yOf(polylines[p].arr[k]));
              }
              ctx.strokeStyle = polylines[p].color;
              ctx.lineWidth = 1.4;
              ctx.stroke();
            }

            // x 轴刻度：times 抽样 6 个标注
            ctx.fillStyle = fg;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            var ticks = 5;
            for (var t = 0; t <= ticks; t++) {
              var idx = Math.round((t * (n - 1)) / ticks);
              ctx.fillText(String(times[idx]), xOf(idx), padT + plotH + 6);
            }

            // 文字图例
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillStyle = hgtColor;
            ctx.fillRect(padL, 6, 12, 3);
            ctx.fillStyle = fg;
            ctx.fillText('沪股通', padL + 16, 2);
            ctx.fillStyle = sztColor;
            ctx.fillRect(padL + 70, 6, 12, 3);
            ctx.fillStyle = fg;
            ctx.fillText('深股通', padL + 86, 2);
          });
        }

        /* ================= Tab 3：大盘指数（多线同图不同色） ================= */
        function drawIndex(items) {
          withCanvas(function (ctx, w, h) {
            var lines = [];
            for (var i = 0; i < items.length; i++) {
              var it = items[i] || {};
              var price = it.price || [];
              var seq = [];
              for (var k = 0; k < price.length; k++) {
                if (isFinite(Number(price[k]))) seq.push(Number(price[k]));
              }
              if (seq.length) lines.push({ name: it.name || it.code || '', spark: seq, pct: Number(it.percent) || 0 });
            }
            // 腾讯源可能返回大量指数条目，图例/线条按序取前 8 只，保证可读
            if (lines.length > 8) lines = lines.slice(0, 8);
            if (!lines.length) return;

            var padL = 64;
            var padR = 20;
            var padT = 24 + lines.length * 16;
            var padB = 16;
            var plotW = w - padL - padR;
            var plotH = h - padT - padB;
            if (plotW <= 0 || plotH <= 0) return;

            var fg = cssVar('--vscode-descriptionForeground', '#9d9d9d');
            var grid = cssVar('--vscode-editorWidget-border', 'rgba(128,128,128,.25)');

            var series = [];
            for (var m = 0; m < lines.length; m++) series.push(lines[m].spark);
            var rng = rangeOf(series);
            var n = lines[0].spark.length;
            var xOf = function (i) {
              return padL + (n === 1 ? plotW / 2 : (i * plotW) / (n - 1));
            };
            var yOf = function (v) {
              return padT + plotH - ((v - rng.min) / (rng.max - rng.min)) * plotH;
            };

            // 网格 + 纵轴
            ctx.font = '10px ' + cssVar('--vscode-editor-font-family', 'monospace');
            ctx.strokeStyle = grid;
            ctx.fillStyle = fg;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            var steps = 4;
            for (var s = 0; s <= steps; s++) {
              var val = rng.min + ((rng.max - rng.min) * s) / steps;
              var y = yOf(val);
              ctx.beginPath();
              ctx.moveTo(padL, y);
              ctx.lineTo(padL + plotW, y);
              ctx.stroke();
              ctx.fillText(Number(val).toFixed(0), padL - 6, y);
            }

            // 逐指数折线
            for (var p = 0; p < lines.length; p++) {
              var arr = lines[p].spark;
              ctx.beginPath();
              for (var q = 0; q < arr.length; q++) {
                if (q === 0) ctx.moveTo(xOf(q), yOf(arr[q]));
                else ctx.lineTo(xOf(q), yOf(arr[q]));
              }
              ctx.strokeStyle = palette(p);
              ctx.lineWidth = 1.4;
              ctx.stroke();

              // 图例：名称 + 涨跌幅（着色区分涨跌）
              ctx.textAlign = 'left';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = palette(p);
              ctx.fillRect(padL, 8 + p * 16, 10, 3);
              ctx.fillStyle = lines[p].pct >= 0 ? palette(0) : palette(1);
              var sign = lines[p].pct >= 0 ? '+' : '';
              ctx.fillText(
                lines[p].name + ' ' + sign + lines[p].pct.toFixed(2) + '%',
                padL + 14,
                14 + p * 16
              );
            }
          });
        }

        /* ================= 渲染分发 ================= */
        function render() {
          updateTabs();

          var box = $('chartEmpty');
          var wrap = $('chartWrap');
          var collisionWrap = $('collisionWrap');

          // 数据碰撞是 DOM 表格，不进入 canvas 绘制路径
          if (currentTab === 'collision') {
            wrap.style.display = 'none';
            box.style.display = 'none';
            collisionWrap.style.display = 'block';
            renderCollision();
            return;
          }
          collisionWrap.style.display = 'none';

          // 服务端未配置 / 接口失败一律空态，不再展示授权引导
          var data = cache[currentTab];
          if (data === undefined || data === null) {
            wrap.style.display = 'none';
            box.style.display = 'inline-flex';
            box.innerHTML =
              data === undefined
                ? '<div class="empty-text">数据加载中…</div>'
                : '<div class="empty-text">数据加载失败，点击重试</div>';
            box.className = 'empty' + (data === null ? ' retriable' : '');
            return;
          }

          box.style.display = 'none';
          box.className = 'empty';
          wrap.style.display = 'block';

          if (currentTab === 'cjl') drawCjl(data);
          else if (currentTab === 'north') drawNorth(data);
          else if (currentTab === 'index') drawIndex(data);
        }

        /* ================= 数据碰撞：文本转义与标签筛选 ================= */
        /** 第三方文本进 innerHTML 前转义，避免注入 */
        function esc(text) {
          return String(text === undefined || text === null ? '' : text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        /** 标签切换：多选按「同时命中」逐步收窄，再次点击取消 */
        function toggleTag(label) {
          if (!label) return;
          var i = selectedTags.indexOf(label);
          if (i === -1) selectedTags.push(label);
          else selectedTags.splice(i, 1);
          render();
        }

        /** 一键清空标签与关键字（Esc / 清空按钮 / 无匹配占位共用） */
        function clearFilters() {
          selectedTags = [];
          searchText = '';
          $('collisionSearch').value = '';
          render();
        }

        /** 结果集按标签（AND）、代码/名称关键字过滤，再按命中数排序 */
        function filteredRows(rows) {
          var out = [];
          var kw = searchText.toLowerCase();
          for (var i = 0; i < rows.length; i++) {
            var row = rows[i] || {};
            var tags = row.tags || [];
            var matchTag = true;
            for (var s = 0; s < selectedTags.length; s++) {
              if (tags.indexOf(selectedTags[s]) === -1) {
                matchTag = false;
                break;
              }
            }
            if (!matchTag) continue;
            if (kw) {
              var text = (String(row.code || '') + ' ' + String(row.name || '')).toLowerCase();
              if (text.indexOf(kw) === -1) continue;
            }
            out.push(row);
          }
          out.sort(function (a, b) {
            var ha = Number(a.hits) || 0;
            var hb = Number(b.hits) || 0;
            var diff = sortDesc ? hb - ha : ha - hb;
            if (diff) return diff;
            var ca = String(a.code || '');
            var cb = String(b.code || '');
            return ca < cb ? -1 : ca > cb ? 1 : 0;
          });
          return out;
        }

        /** 标签 chips：条数基于完整结果，0 条置灰；「全部」清空所有标签 */
        function renderCollisionTags(rows) {
          var labels = COLLISION_TAG_META.slice();
          for (var r = 0; r < rows.length; r++) {
            var list = (rows[r] && rows[r].tags) || [];
            for (var t = 0; t < list.length; t++) {
              if (list[t] && labels.indexOf(list[t]) === -1) labels.push(list[t]);
            }
          }
          var counts = {};
          for (var i = 0; i < labels.length; i++) {
            var c = 0;
            for (var j = 0; j < rows.length; j++) {
              if (((rows[j] && rows[j].tags) || []).indexOf(labels[i]) !== -1) c++;
            }
            counts[labels[i]] = c;
          }
          var html =
            '<button type="button" class="lq-chip' + (selectedTags.length ? '' : ' active') +
            '" data-filter-all="1">全部 ' + rows.length + '</button>';
          for (var k = 0; k < labels.length; k++) {
            var label = labels[k];
            html +=
              '<button type="button" class="lq-chip' +
              (selectedTags.indexOf(label) !== -1 ? ' active' : '') +
              (counts[label] ? '' : ' zero') +
              '" data-filter-tag="' + esc(label) + '">' + esc(label) + ' ' + counts[label] + '</button>';
          }
          $('collisionTagBar').innerHTML = html;
        }

        /* ================= 数据碰撞 ================= */
        /** 6 档窗口 chips（元数据由宿主 init 下发） */
        function renderCollisionBars() {
          var html = '';
          for (var j = 0; j < COLLISION_DAY_META.length; j++) {
            var d = COLLISION_DAY_META[j];
            html +=
              '<button type="button" class="lq-chip' +
              (d.num === currentCollisionDays ? ' active' : '') +
              '" data-days="' + d.num + '">' + esc(d.name) + '</button>';
          }
          $('collisionDays').innerHTML = html;
        }

        /** 结果表：服务端快照 + 本地标签/关键字筛选，服务不可用一律空态 */
        function renderCollision() {
          renderCollisionBars();
          var box = $('collisionBody');
          var summary = $('collisionSummary');
          var hint = $('collisionFilterHint');

          if (collision === undefined || collision === null) {
            summary.textContent = '';
            hint.textContent = '';
            renderCollisionTags([]);
            box.innerHTML = '<div class="collision-placeholder">碰撞计算中…</div>';
            return;
          }
          if (collision.unavailable) {
            summary.textContent = '';
            hint.textContent = '';
            renderCollisionTags([]);

            var reason = collision.reason || 'unreachable';
            var title = '数据服务暂不可用';
            var tip = '请稍后重试，或检查数据服务状态';
            if (reason === 'unconfigured') {
              title = '数据服务未配置';
              tip = '请在设置中填写 quote-pulse.dataApiBaseUrl 与 quote-pulse.dataApiKey';
            } else if (reason === 'unauthorized') {
              title = 'API Key 无效（HTTP ' + (collision.httpStatus || 401) + '）';
              tip = '请检查 quote-pulse.dataApiKey 是否与服务端 QP_API_KEY 一致';
            } else if (reason === 'no_data') {
              title = '服务端暂无近' + currentCollisionDays + '天碰撞快照';
              tip = '等待服务端下一轮抓取生成快照后重试';
            } else if (reason === 'invalid_response') {
              title = '数据服务返回异常';
              tip = '请检查服务端版本与接口返回，或稍后重试';
            } else {
              title = '数据服务连接失败';
              tip = '请确认 quote-pulse.dataApiBaseUrl 可访问且服务已启动（8800 端口）';
            }
            box.innerHTML =
              '<div class="collision-placeholder"><b>' + esc(title) + '</b><br>' +
              esc(tip) + '<br>' +
              '<button type="button" class="btn" data-action="retry">重试</button></div>';
            return;
          }

          var rows = collision.rows || [];
          var available = typeof collision.available === 'number' ? collision.available : 0;
          var total = typeof collision.total === 'number' ? collision.total : 0;
          var daysName = '近' + currentCollisionDays + '天';
          var shown = filteredRows(rows);

          renderCollisionTags(rows);
          hint.textContent = selectedTags.length
            ? '已选 ' + selectedTags.length + ' 个标签（同时命中）· Esc 清空'
            : '点标签叠加筛选（同时命中），点击「命中」列可排序';
          summary.textContent =
            '命中≥2 共 ' + rows.length + ' 只' +
            (shown.length !== rows.length ? ' · 筛选后 ' + shown.length + ' 只' : '') +
            ' · 已取 ' + available + '/' + total + ' · ' + daysName +
            (collision.dataDate ? ' · ' + collision.dataDate : '');

          if (!rows.length) {
            box.innerHTML =
              '<div class="collision-placeholder">' + esc(daysName) +
              '没有命中 ≥2 个策略的股票</div>';
            return;
          }
          if (!shown.length) {
            box.innerHTML =
              '<div class="collision-placeholder">没有符合筛选条件的股票<br>' +
              '<button type="button" class="btn" data-action="clear">清空筛选</button></div>';
            return;
          }

          var html =
            '<table class="collision-table"><thead><tr><th>代码</th><th>名称</th>' +
            '<th class="sortable" data-sort="hits">命中 ' + (sortDesc ? '▼' : '▲') + '</th>' +
            '<th>标签</th><th></th></tr></thead><tbody>';
          for (var r = 0; r < shown.length; r++) {
            var row = shown[r];
            var tags = '';
            var list = row.tags || [];
            for (var t = 0; t < list.length; t++) {
              var label = String(list[t]);
              tags +=
                '<span class="lq-hit-tag filterable' +
                (selectedTags.indexOf(label) !== -1 ? ' selected' : '') +
                '" data-filter-tag="' + esc(label) + '">' + esc(label) + '</span>';
            }
            html +=
              '<tr><td>' + esc(row.code) + '</td><td>' + esc(row.name) + '</td>' +
              '<td>' + esc(row.hits) + '</td><td>' + tags + '</td>' +
              '<td><button type="button" class="lq-row-btn" data-code="' +
              esc(row.code) + '">资金动态</button></td></tr>';
          }
          html += '</tbody></table>';
          box.innerHTML = html;
        }

        /* ================= 消息 ================= */
        window.addEventListener('message', function (event) {
          var msg = event.data;
          if (!msg || !msg.data) return;

          // 碰撞数据走独立消息：筛选状态保留，仅刷新结果
          if (msg.type === 'collision') {
            collision = msg.data;
            if (typeof msg.data.days === 'number') currentCollisionDays = msg.data.days;
            renderCollision();
            return;
          }

          if (msg.type !== 'init' || !msg.data.tab) return;
          var data = msg.data;

          currentTab = data.tab;
          if (Array.isArray(data.collisionDayMeta)) COLLISION_DAY_META = data.collisionDayMeta;
          if (Array.isArray(data.collisionTags)) COLLISION_TAG_META = data.collisionTags;
          if (typeof data.collisionDays === 'number') currentCollisionDays = data.collisionDays;

          // 仅更新本次推送对应 tab 的缓存，其他 tab 缓存保留（避免覆盖已取数据）
          if (data.tab === 'cjl') cache.cjl = data.cjl;
          else if (data.tab === 'north') cache.north = data.north;
          else if (data.tab === 'index') cache.index = data.index;

          var ts = data.updatedAt;
          $('updatedAt').textContent = ts ? '更新于 ' + new Date(ts).toLocaleTimeString() : '';
          setStatus('');
          render();

          // 进入/刷新「数据碰撞」tab 才向宿主索取数据；宿主命中缓存时不发网络请求
          if (data.tab === 'collision') vscode.postMessage({ command: 'requestCollision' });
        });

        /* ================= 交互 ================= */
        var TAB_IDS = {
          tabCjl: 'cjl',
          tabNorth: 'north',
          tabIndex: 'index',
          tabCollision: 'collision',
        };
        for (var tid in TAB_IDS) {
          (function (id) {
            $(id).addEventListener('click', function () {
              var tab = TAB_IDS[id];
              if (tab === currentTab) return;
              currentTab = tab;
              render();
              vscode.postMessage({ command: 'selectTab', tab: tab });
            });
          })(tid);
        }

        $('refreshBtn').addEventListener('click', function () {
          vscode.postMessage({ command: 'refresh' });
        });

        // 失败占位点击重试（元素不随 innerHTML 重建，启动时绑定一次）
        $('chartEmpty').addEventListener('click', function () {
          if (cache[currentTab] === null) {
            vscode.postMessage({ command: 'refresh' });
          }
        });

        // 碰撞窗口切档（筛选状态保留，等新快照回来再重绘）
        $('collisionDays').addEventListener('click', function (e) {
          var days = e && e.target && e.target.getAttribute ? e.target.getAttribute('data-days') : null;
          if (!days) return;
          currentCollisionDays = Number(days);
          renderCollisionBars();
          vscode.postMessage({ command: 'selectCollisionDays', days: Number(days) });
        });

        // 标签 chips：「全部」清空，其余切换（innerHTML 重建不影响委托）
        $('collisionTagBar').addEventListener('click', function (e) {
          var target = e && e.target;
          if (!target || !target.getAttribute) return;
          if (target.getAttribute('data-filter-all')) {
            if (selectedTags.length) {
              selectedTags = [];
              render();
            }
            return;
          }
          toggleTag(target.getAttribute('data-filter-tag'));
        });

        // 关键字搜索：纯本地过滤，不发网络请求
        $('collisionSearch').addEventListener('input', function (e) {
          var value = e && e.target && e.target.value;
          searchText = typeof value === 'string' ? value.trim() : '';
          render();
        });
        $('collisionClear').addEventListener('click', clearFilters);

        // 结果区统一委托：标签 / 排序 / 清空 / 重试 / 打开个股
        $('collisionBody').addEventListener('click', function (e) {
          var target = e && e.target;
          if (!target || !target.getAttribute) return;
          var get = function (key) { return target.getAttribute(key); };
          var action = get('data-action');
          if (action === 'retry') {
            vscode.postMessage({ command: 'refreshCollision' });
            return;
          }
          if (action === 'clear') {
            clearFilters();
            return;
          }
          if (get('data-sort')) {
            sortDesc = !sortDesc;
            render();
            return;
          }
          var label = get('data-filter-tag');
          if (label) {
            toggleTag(label);
            return;
          }
          var code = get('data-code');
          if (code) vscode.postMessage({ command: 'openStock', code: code });
        });

        // Esc 一键清空标签与关键字
        window.addEventListener('keydown', function (e) {
          var isEsc = e && (e.key === 'Escape' || e.keyCode === 27);
          if (isEsc && (selectedTags.length || searchText)) clearFilters();
        });

        // 布局变化重画当前图表 tab（数据碰撞是 DOM 表格，无需重画）
        window.addEventListener('resize', function () {
          if (currentTab === 'collision') return;
          render();
        });

        setStatus('连接中…');
        vscode.postMessage({ command: 'ready' });
      })();
    </script>
  </body>
</html>
